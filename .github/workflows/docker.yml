# Builds the Docker image on every push to main and publishes it to GitHub Container Registry.
# The NAS compares the published digest of :latest with what it runs and offers an update when they differ.
name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']          # pushing a tag like v1.2.0 also publishes :1.2.0
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yunlee46/openseadragon-map-webui

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
