<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maps</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/vendor/osd/openseadragon.min.js"></script>
</head>
<body class="viewer-page">
  <header class="topbar">
    <button id="back" class="btn" title="Back to previous map" hidden>&larr; Back</button>
    <h1 id="map-name">Loading…</h1>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="show-shapes" checked> Show hitboxes &amp; notes</label>
    <select id="map-select" aria-label="Choose a map"></select>
    <button id="panel-btn" class="btn" title="Images on this map" aria-expanded="false">☰ Images</button>
    <a class="btn ghost" href="/admin/">Admin</a>
  </header>
  <div class="viewer-body">
    <main id="viewer"></main>
    <aside id="side-panel" class="side-panel" hidden>
      <div class="side-head">
        <strong>Images</strong>
        <button class="btn ghost small" id="panel-close" aria-label="Close panel">✕</button>
      </div>
      <div class="side-controls">
        <label class="switch"><input type="checkbox" id="focus-toggle"> <span>Focus mode</span></label>
        <label class="setting-row compact">
          <span>Others' visibility</span>
          <span class="slider-group">
            <input type="range" id="focus-opacity" min="0" max="1" step="0.05">
            <output id="focus-opacity-out"></output>
          </span>
        </label>
        <label class="switch"><input type="checkbox" id="zoom-toggle"> <span>Zoom-reveal</span></label>
        <p class="hint small">Click an image to go to it. With focus mode on, the others fade so it stands out. Double-clicking an image on the map also focuses it.</p>
      </div>
      <div id="viewer-outliner"></div>
    </aside>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="popup" class="popup" hidden>
    <button class="close" aria-label="Close">&times;</button>
    <h3></h3>
    <p></p>
  </div>
  <div id="empty" class="empty" hidden></div>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
