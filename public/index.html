<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maps</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/vendor/osd/openseadragon.min.js"></script>
</head>
<body class="viewer-page">
  <header class="topbar">
    <button id="back" class="icon-btn ghost" data-icon="back" data-tip="Back" hidden></button>
    <nav id="crumbs" class="crumbs" aria-label="Where you are"></nav>
    <div class="spacer"></div>
    <div class="search" id="search-box">
      <button class="icon-btn ghost" id="search-open" data-icon="search" data-tip="Search"></button>
      <input id="search" type="search" placeholder="Search maps, images, notes…" autocomplete="off" aria-label="Search">
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
    <label class="icon-toggle" data-icon="pointer" data-tip="Show hitboxes and notes"><input type="checkbox" id="show-shapes" checked></label>
    <select id="map-select" aria-label="Choose a map"></select>
    <button id="share-btn" class="icon-btn ghost" data-icon="share" data-tip="Copy a link to this view"></button>
    <button id="panel-btn" class="icon-btn" data-icon="layers" data-tip="Images on this map" aria-expanded="false"></button>
    <a class="icon-btn ghost admin-link" href="/admin/" data-icon="key" data-tip="Admin"></a>
  </header>
  <div id="preview-banner" class="preview-banner" hidden>Draft preview: this is what visitors will see after you publish. <a id="preview-edit" href="/admin/">Back to editor</a></div>
  <div class="viewer-body">
    <main id="viewer"></main>
    <aside id="side-panel" class="side-panel" hidden>
      <div class="side-head">
        <strong>Images</strong>
        <button class="icon-btn small ghost" id="panel-close" data-icon="x" data-tip="Close"></button>
      </div>
      <div class="side-controls">
        <label class="switch"><input type="checkbox" id="focus-toggle"> <span>Focus mode</span></label>
        <label class="setting-row compact">
          <span>Others' visibility</span>
          <span class="slider-group">
            <input type="range" id="focus-opacity" min="0" max="1" step="0.05">
            <output id="focus-opacity-out"></output>
          </span>
        </label>
        <label class="switch"><input type="checkbox" id="zoom-toggle"> <span>Zoom-reveal</span></label>
        <label class="switch" data-tip="Small images fade away when you zoom out, and come back when you zoom in"><input type="checkbox" id="small-toggle"> <span>Fade small images</span></label>
        <p class="hint small">Click an image to go to it. With focus mode on, the others fade so it stands out. Double-clicking an image on the map also focuses it.</p>
      </div>
      <div id="viewer-outliner"></div>
    </aside>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="popup" class="popup" hidden>
    <button class="close icon-btn small ghost" data-icon="x" data-tip="Close"></button>
    <h3></h3>
    <img class="note-image" alt="" hidden>
    <div class="note-body"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="empty" class="empty" hidden></div>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
